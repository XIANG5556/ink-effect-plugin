<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>墨汁特效测试页</title>
  <link rel="stylesheet" href="content.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,"PingFang SC",sans-serif;color:#f8f2ff;background:radial-gradient(circle at 70% 18%,#371261 0,#180a2b 42%,#090410 100%)}
    main{width:min(760px,calc(100% - 36px));padding:56px;border:1px solid #a95cff33;border-radius:28px;background:linear-gradient(145deg,#35174bdd,#160b25e8);box-shadow:0 28px 80px #0009} .eyebrow{color:#d477ff;font-weight:850;letter-spacing:.18em;text-transform:uppercase}h1{margin:.35em 0 .22em;font-size:clamp(42px,7vw,72px);line-height:1;background:linear-gradient(90deg,#fff,#dc9cff 55%,#9b4cff);-webkit-background-clip:text;color:transparent}p{color:#c1acd3;font-size:18px;line-height:1.7}label{display:block;margin:34px 0 10px;color:#eadcf5;font-weight:750}input{width:100%;height:62px;padding:0 20px;border:1px solid #72439a;border-radius:16px;outline:0;background:#100719;color:#fff;font:700 22px inherit;box-shadow:inset 0 2px 8px #0008;transition:.2s}input:focus{border-color:#c264ff;box-shadow:0 0 0 5px #a847ff26,inset 0 2px 8px #0008}.hint{font-size:13px;color:#8f76a2}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Extension playground</div>
    <h1>紫色墨汁弹出效果</h1>
    <p>输入独立的三个英文触发字母后，页面中央会快速弹出一团带高光的立体紫色墨汁。</p>
    <label for="summon">在这里试一下</label>
    <input id="summon" placeholder="输入 ink 即可自动触发" autofocus>
    <p class="hint">插件安装或重新加载后，需要刷新已经打开的网页。包含在其他英文单词中时不会误触发。</p>
  </main>
  <script>
    if (new URLSearchParams(location.search).has('standalone')) {
      window.chrome = {
        storage: {
          sync: { get: (defaults, callback) => callback(defaults) },
          onChanged: { addListener: () => {} }
        },
        runtime: {
          getURL: path => path,
          onMessage: { addListener: () => {} }
        }
      };
      const script = document.createElement('script');
      script.src = 'content.js';
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
